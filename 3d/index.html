<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />

    <!-- FAVICON -->
    <link rel="shortcut icon" href="assets/img/Icon.png" type="image/png" />

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Syne:wght@700;800&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- REMIXICONS -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css"
    />

    <!-- THREE.JS & GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

    <title>Md Sahadat Hossain | 3D Interactive Developer Room</title>

    <style>
      :root {
        --cyan-neon: #00f0ff;
        --orange-neon: #ff6b35;
        --green-neon: #00ff88;
        --purple-neon: #a855f7;
        --bg-dark: #0a0a0f;
        --font-main: "Inter", sans-serif;
        --font-title: "Syne", sans-serif;
        --font-mono: "JetBrains Mono", monospace;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg-dark);
        font-family: var(--font-main);
        color: #ffffff;
      }

      #webgl-canvas {
        width: 100%;
        height: 100%;
        display: block;
        cursor: grab;
      }

      #webgl-canvas:active {
        cursor: grabbing;
      }

      /* TOP-RIGHT SMOOTH METER HUD (MATCHING REFERENCE IMAGE) */
      .hud-meter-topright {
        position: fixed;
        top: 20px;
        right: 20px;
        display: flex;
        align-items: center;
        gap: 6px;
        background: rgba(16, 185, 129, 0.9);
        color: #07070d;
        font-family: var(--font-mono);
        font-size: 0.75rem;
        font-weight: 700;
        padding: 6px 12px;
        border-radius: 6px;
        box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        z-index: 100;
        pointer-events: auto;
        cursor: default;
      }

      .hud-meter-topright span {
        font-size: 0.65rem;
        opacity: 0.85;
      }

      /* BOTTOM-RIGHT FLOATING TOOLBAR DOCK */
      .hud-floating-dock {
        position: fixed;
        bottom: 24px;
        right: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        z-index: 100;
      }

      .dock-icon-btn {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #0d0d14;
        font-size: 1.15rem;
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
        cursor: pointer;
        transition: all 0.25s ease;
      }

      .dock-icon-btn:hover {
        background: var(--cyan-neon);
        color: #07070d;
        transform: scale(1.1);
        box-shadow: 0 0 16px var(--cyan-neon);
      }

      .dock-battery {
        background: #0ea5e9;
        color: #ffffff;
        font-family: var(--font-mono);
        font-size: 0.68rem;
        font-weight: 700;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        padding: 4px;
      }

      .dock-battery i {
        font-size: 0.9rem;
      }

      /* BOTTOM-LEFT CAMERA SWITCH / RESET BUTTON */
      .hud-btn-scroll-bottom {
        position: fixed;
        bottom: 24px;
        left: 20px;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.85);
        border: 1.5px solid #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #07070d;
        font-size: 1.3rem;
        cursor: pointer;
        z-index: 100;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
        transition: all 0.25s ease;
      }

      .hud-btn-scroll-bottom:hover {
        background: #ffffff;
        transform: translateY(2px) scale(1.08);
        box-shadow: 0 0 18px rgba(255, 255, 255, 0.8);
      }

      /* TOP-LEFT PORTFOLIO RETURN LINK */
      .hud-portfolio-link {
        position: fixed;
        top: 20px;
        left: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(10, 10, 18, 0.75);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
        color: #f1f5f9;
        font-family: var(--font-main);
        font-size: 0.82rem;
        font-weight: 600;
        letter-spacing: 0.5px;
        padding: 8px 18px;
        border-radius: 24px;
        text-decoration: none;
        cursor: pointer;
        z-index: 100;
        transition: all 0.25s ease;
      }

      .hud-portfolio-link:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.45);
        color: #ffffff;
        transform: translateY(-2px);
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
      }

      /* INTERACTION HINT PILL */
      .hud-interaction-hint {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(10, 10, 18, 0.85);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        padding: 8px 18px;
        border-radius: 25px;
        font-size: 0.76rem;
        color: #e4e4e7;
        pointer-events: none;
        z-index: 90;
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .hud-interaction-hint i {
        color: var(--cyan-neon);
        font-size: 0.95rem;
      }

      /* DETAIL INSPECTION DRAWER (CYBER HUD MODAL) */
      .hud-project-modal {
        position: fixed;
        bottom: 30px;
        right: 80px;
        max-width: 430px;
        width: calc(100% - 120px);
        background: rgba(12, 12, 22, 0.92);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1.5px solid var(--cyan-neon);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 35px rgba(0, 240, 255, 0.3);
        border-radius: 20px;
        padding: 24px;
        z-index: 200;
        opacity: 0;
        transform: translateY(30px) scale(0.95);
        pointer-events: none;
        transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      .hud-project-modal.active {
        opacity: 1;
        transform: translateY(0) scale(1);
        pointer-events: auto;
      }

      .modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }

      .modal-badge {
        font-family: var(--font-mono);
        font-size: 0.7rem;
        text-transform: uppercase;
        color: var(--cyan-neon);
        background: rgba(0, 240, 255, 0.12);
        border: 1px solid rgba(0, 240, 255, 0.35);
        padding: 3px 10px;
        border-radius: 6px;
        font-weight: 700;
      }

      .modal-close-btn {
        background: rgba(255, 255, 255, 0.08);
        border: none;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        color: #fff;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.1rem;
        transition: all 0.2s ease;
      }

      .modal-close-btn:hover {
        background: #f43f5e;
        color: #fff;
      }

      .modal-title {
        font-family: var(--font-title);
        font-size: 1.25rem;
        font-weight: 800;
        color: #fff;
        margin-bottom: 8px;
        line-height: 1.3;
      }

      .modal-desc {
        font-size: 0.84rem;
        color: #a1a1aa;
        line-height: 1.55;
        margin-bottom: 16px;
      }

      .modal-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 18px;
      }

      .modal-tag {
        font-family: var(--font-mono);
        font-size: 0.68rem;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        color: #e4e4e7;
        padding: 3px 8px;
        border-radius: 4px;
      }

      .modal-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .modal-action-btn {
        flex: 1;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 10px 14px;
        border-radius: 10px;
        font-size: 0.82rem;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        transition: all 0.25s ease;
      }

      .btn-primary-action {
        background: var(--cyan-neon);
        color: #07070d;
        border: 1px solid var(--cyan-neon);
        box-shadow: 0 0 16px rgba(0, 240, 255, 0.4);
      }

      .btn-primary-action:hover {
        background: #fff;
        border-color: #fff;
        box-shadow: 0 0 25px rgba(255, 255, 255, 0.6);
      }

      .btn-secondary-action {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .btn-secondary-action:hover {
        background: rgba(255, 255, 255, 0.16);
      }

      @media (max-width: 768px) {
        .hud-project-modal {
          bottom: 16px;
          right: 16px;
          left: 16px;
          width: auto;
        }
        .hud-portfolio-link {
          top: 14px;
          left: 14px;
          padding: 6px 14px;
          font-size: 0.78rem;
        }
      }
    </style>
  </head>
  <body>
    <!-- TOP-LEFT PORTFOLIO RETURN LINK -->
    <a href="/projects" class="hud-portfolio-link" title="Return to Main Portfolio">
      <i class="ri-arrow-left-line" style="margin-right: 6px;"></i> Back to Portfolio
    </a>

    <!-- TOP-RIGHT PERFORMANCE SMOOTH METER HUD (MATCHING PHOTO) -->
    <div class="hud-meter-topright" id="meter-fps">
      100% Smooth Meter <i class="ri-arrow-down-s-fill"></i>
    </div>

    <!-- BOTTOM-LEFT CAMERA SCROLL TOGGLE (MATCHING PHOTO) -->
    <button type="button" class="hud-btn-scroll-bottom" id="btn-camera-cycle" title="Cycle Views: Overview · Project Wall · PC Desk">

    <!-- BOTTOM-RIGHT FLOATING TOOLBAR DOCK (MATCHING PHOTO) -->
    <aside class="hud-floating-dock">
      <button type="button" class="dock-icon-btn" id="btn-fullscreen" title="Toggle Fullscreen">

      <a href="https://www.linkedin.com/in/mdsahadatconnact/" target="_blank" rel="noopener noreferrer" class="dock-icon-btn" title="LinkedIn Profile">

      </a>

        <i class="ri-instagram-line"></i>

    <!-- INTERACTION HINT -->

    <!-- DETAIL INSPECT MODAL (HUD POPUP) -->
    <div class="hud-project-modal" id="hud-modal">
      <div class="modal-header">
        <span class="modal-badge" id="modal-badge">PROJECT FOCUS</span>
        <button type="button" class="modal-close-btn" id="modal-close-btn">
          <i class="ri-close-line"></i>
        </button>
      </div>
      <h3 class="modal-title" id="modal-title">Space Corridor — 3D Model</h3>
      <p class="modal-desc" id="modal-desc">
        Interactive 3D real-time simulation built with Three.js, shaders, and dynamic lighting.
      </p>
      <div class="modal-tags" id="modal-tags">
        <span class="modal-tag">Three.js</span>

      <div class="modal-actions">
        <a href="https://github.com/stl-sahadat" target="_blank" id="modal-link-demo" class="modal-action-btn btn-primary-action">
          Live Project <i class="ri-external-link-line"></i>

        <a href="https://github.com/stl-sahadat" target="_blank" id="modal-link-git" class="modal-action-btn btn-secondary-action">
          Source Code <i class="ri-github-line"></i>
        </a>

    <!-- 3D WEBGL CANVAS -->
    <canvas id="webgl-canvas"></canvas>

    <!-- THREE.JS SCENE ENGINE -->
    <script>
      (function () {
        'use strict';

        // --- 1. SETUP THREE.JS SCENE, CAMERA, RENDERER ---
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0f);

        const camera = new THREE.PerspectiveCamera(
          43,
          window.innerWidth / window.innerHeight,
          0.1,
          1000
        );

        // Wide panoramic view: Chair & desk & entrance door on left, TV project wall on right
        const DEFAULT_CAM_POS = new THREE.Vector3(-5.0, 15.0, 26.5);
        const DEFAULT_TARGET = new THREE.Vector3(1.5, 5.5, -2.0);

        // Start camera slightly further away for smooth entrance glide
        camera.position.set(-8.0, 19.0, 32.0);

        const renderer = new THREE.WebGLRenderer({
          canvas: canvas,
          antialias: true,
          powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.copy(DEFAULT_TARGET);
        controls.minDistance = 5;
        controls.maxDistance = 42;
        controls.maxPolarAngle = Math.PI / 2 + 0.01;
        controls.update();

        // Smooth cinematic glide straight into the room on page load
        gsap.to(camera.position, {
          x: DEFAULT_CAM_POS.x,
          y: DEFAULT_CAM_POS.y,
          z: DEFAULT_CAM_POS.z,
          duration: 1.8,
          ease: "power2.out"
        });

        // --- 2. LIGHTING RIG ---
        // Ambient soft fill
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);

        // Ceiling Main Cyan Neon Flood
        const ceilingPoint = new THREE.PointLight(0x00f0ff, 2.8, 38);
        ceilingPoint.position.set(0, 16.5, 0);
        scene.add(ceilingPoint);

        // Desk Warm Spotlight (over monitor & PC)
        const deskSpot = new THREE.SpotLight(0xffffff, 2.2);
        deskSpot.position.set(-6, 13, -3);
        deskSpot.target.position.set(-6, 3.5, -6);
        deskSpot.angle = 0.6;
        deskSpot.penumbra = 0.7;
        deskSpot.castShadow = true;
        scene.add(deskSpot);
        scene.add(deskSpot.target);

        // Right Wall Ambient Spotlight for "MY WORKS" & TV displays
        const wallSpot = new THREE.SpotLight(0xdbeafe, 1.15);
        wallSpot.position.set(1.0, 11.0, 4.0);
        wallSpot.target.position.set(13.0, 7.5, 0.0);
        wallSpot.angle = 0.95;
        wallSpot.penumbra = 1.0;
        scene.add(wallSpot);
        scene.add(wallSpot.target);

        // --- 3. MATERIALS CACHE ---
        const cyanNeonMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
        const orangeNeonMat = new THREE.MeshBasicMaterial({ color: 0xff6b35 });
        const greenNeonMat = new THREE.MeshBasicMaterial({ color: 0x00ff88 });

        const whiteGlossMat = new THREE.MeshStandardMaterial({
          color: 0xf8f9fa,
          roughness: 0.18,
          metalness: 0.05
        });

        const blackMatteMat = new THREE.MeshStandardMaterial({
          color: 0x141418,
          roughness: 0.85,
          metalness: 0.1
        });

        const darkRightWallMat = new THREE.MeshBasicMaterial({
          color: 0x141418
        });

        const darkSlateTileMat = new THREE.MeshStandardMaterial({
          color: 0x111216,
          roughness: 0.7,
          metalness: 0.15
        });

        // --- 4. PROCEDURAL ROOM GEOMETRY (MATCHING PHOTO) ---
        const ROOM_SIZE = 26;
        const ROOM_HEIGHT = 17;
        const HALF_SIZE = ROOM_SIZE / 2;

        // FLOOR: Dark Slate Square Tiles with fine grid seams
        const floorGeo = new THREE.PlaneGeometry(ROOM_SIZE, ROOM_SIZE);
        const floor = new THREE.Mesh(floorGeo, darkSlateTileMat);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Tile Grid Grout Lines on floor
        const floorGrid = new THREE.GridHelper(ROOM_SIZE, 12, 0x22242a, 0x1a1c22);
        floorGrid.position.y = 0.015;
        scene.add(floorGrid);

        // BACK WALL (Dark Matte Wall with Circuit & Workstation)
        const backWallGeo = new THREE.PlaneGeometry(ROOM_SIZE, ROOM_HEIGHT);
        const backWall = new THREE.Mesh(backWallGeo, blackMatteMat);
        backWall.position.set(0, ROOM_HEIGHT / 2, -HALF_SIZE);
        backWall.receiveShadow = true;
        scene.add(backWall);

        // WEST WALL (Left Wall - Dark Matte Wall with Entrance Door & Wall Clock)
        const westWallGeo = new THREE.PlaneGeometry(ROOM_SIZE, ROOM_HEIGHT);
        const westWall = new THREE.Mesh(westWallGeo, blackMatteMat);
        westWall.position.set(-HALF_SIZE, ROOM_HEIGHT / 2, 0);
        westWall.rotation.y = Math.PI / 2;
        westWall.receiveShadow = true;
        scene.add(westWall);

        // Sleek Office Entrance Door on West Wall (Matches user request for Chair & Door on left)
        const doorFrameGeo = new THREE.BoxGeometry(0.14, 10.5, 4.8);
        const doorFrameMat = new THREE.MeshStandardMaterial({ color: 0x1f242d, roughness: 0.5 });
        const doorFrame = new THREE.Mesh(doorFrameGeo, doorFrameMat);
        doorFrame.position.set(-HALF_SIZE + 0.08, 5.25, 4.2);
        scene.add(doorFrame);

        const doorLeafGeo = new THREE.BoxGeometry(0.1, 10.1, 4.4);
        const doorLeafMat = new THREE.MeshStandardMaterial({ color: 0x0c0e14, roughness: 0.7 });
        const doorLeaf = new THREE.Mesh(doorLeafGeo, doorLeafMat);
        doorLeaf.position.set(-HALF_SIZE + 0.1, 5.05, 4.2);
        scene.add(doorLeaf);

        // Glowing Cyan Handle on Door
        const doorHandleGeo = new THREE.CylinderGeometry(0.04, 0.04, 1.4, 16);
        const doorHandle = new THREE.Mesh(doorHandleGeo, cyanNeonMat);
        doorHandle.position.set(-HALF_SIZE + 0.22, 5.0, 2.5);
        scene.add(doorHandle);

        // RIGHT WALL (Matte Architectural Wall with TV Matrix)
        const rightWallGeo = new THREE.PlaneGeometry(ROOM_SIZE, ROOM_HEIGHT);
        const rightWall = new THREE.Mesh(rightWallGeo, darkRightWallMat);
        rightWall.position.set(HALF_SIZE, ROOM_HEIGHT / 2, 0);
        rightWall.rotation.y = -Math.PI / 2;
        rightWall.receiveShadow = true;
        scene.add(rightWall);

        // OPEN DIORAMA ROOF ARCHITECTURE (No dark ceiling slab - completely open & clear)
        // Architectural Neon Edge Trims defining the wall tops
        const trimBack = new THREE.Mesh(new THREE.BoxGeometry(ROOM_SIZE, 0.15, 0.2), cyanNeonMat);
        trimBack.position.set(0, ROOM_HEIGHT - 0.1, -HALF_SIZE + 0.1);
        scene.add(trimBack);

        const trimWest = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, ROOM_SIZE), cyanNeonMat);
        trimWest.position.set(-HALF_SIZE + 0.1, ROOM_HEIGHT - 0.1, 0);
        scene.add(trimWest);

        const trimRight = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, ROOM_SIZE), cyanNeonMat);
        trimRight.position.set(HALF_SIZE - 0.1, ROOM_HEIGHT - 0.1, 0);
        scene.add(trimRight);

        // Corner Square Downlights
        [-HALF_SIZE + 3, HALF_SIZE - 3].forEach(cx => {
          [-HALF_SIZE + 3, HALF_SIZE - 3].forEach(cz => {
            const downGeo = new THREE.PlaneGeometry(0.9, 0.9);
            const downMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const down = new THREE.Mesh(downGeo, downMat);
            down.rotation.x = Math.PI / 2;
            down.position.set(cx, ROOM_HEIGHT - 0.05, cz);
            scene.add(down);
          });
        });

        // --- 5. LEFT WALL: ORANGE CIRCUIT PATTERN & AC UNIT ---
        const circuitGroup = new THREE.Group();
        // Exact branched lines as seen in reference picture
        const circuits = [
          // Top branch
          { x: -7, y: 11.2, w: 7, rot: 0 },
          { x: -3.0, y: 11.6, w: 2.2, rot: 0.45 },
          { x: -0.5, y: 12.0, w: 4.5, rot: 0 },

          // Second line
          { x: -6, y: 10.2, w: 8.5, rot: 0 },
          { x: -1.0, y: 9.6, w: 3.5, rot: -0.4 },
          { x: 1.5, y: 9.2, w: 4.0, rot: 0 },

          // Third line
          { x: -7.5, y: 8.8, w: 6.5, rot: 0 },

          // Fourth line
          { x: -6.5, y: 7.6, w: 9.0, rot: 0 },
          { x: -1.2, y: 7.0, w: 3.8, rot: -0.35 },
          { x: 1.8, y: 6.5, w: 4.5, rot: 0 },

          // Fifth line (lower branch)
          { x: -6.0, y: 5.6, w: 7.5, rot: 0 },
          { x: -1.5, y: 6.2, w: 3.2, rot: 0.4 },
          { x: 1.0, y: 6.7, w: 3.5, rot: 0 }
        ];

            }

          outputTexture.magFilter = THREE.LinearFilter;
          outputTexture.generateMipmaps = false;

          if (webglReady) {
            gl.bindTexture(gl.TEXTURE_2D, tex);
            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
            gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, textCanvas);
            gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
            gl.viewport(0, 0, G, j);
            gl.uniform1f(uTimeLoc, 0);
            gl.drawArrays(gl.TRIANGLES, 0, 3);

              sCtx.fillText('Reserved for upcoming primary showcase, live application stream, or architecture diagrams.', cx, 344);

              // Left Widget: System Health
              sCtx.textAlign = 'left';
              sCtx.fillStyle = 'rgba(15, 23, 42, 0.75)';
              sCtx.fillRect(36, 175, 240, 260);
              sCtx.strokeStyle = 'rgba(0, 240, 255, 0.22)';
              sCtx.strokeRect(36, 175, 240, 260);

              sCtx.fillStyle = '#38bdf8';
              sCtx.font = 'bold 15px "JetBrains Mono", monospace';
              sCtx.fillText('CORE METRICS', 52, 205);

              const leftStats = [
                ['CLUSTER HEALTH', '100% NOMINAL'],
                ['BANDWIDTH', '10 Gbps FIBER'],
                ['CORE LATENCY', '0.24ms'],
                ['ACTIVE NODES', '16 ONLINE'],
                ['DISPLAY MODE', 'ULTRA-WIDE']
              ];
              leftStats.forEach(([k, v], idx) => {
                sCtx.fillStyle = '#64748b';
                sCtx.font = '12px "JetBrains Mono", monospace';
                sCtx.fillText(k, 52, 240 + idx * 38);
                sCtx.fillStyle = '#10b981';
                sCtx.font = 'bold 13px "JetBrains Mono", monospace';
                sCtx.fillText(v, 52, 257 + idx * 38);
              });

              // Right Widget: Pipeline Telemetry
              sCtx.fillStyle = 'rgba(15, 23, 42, 0.75)';
              sCtx.fillRect(748, 175, 240, 260);
              sCtx.strokeStyle = 'rgba(0, 240, 255, 0.22)';
              sCtx.strokeRect(748, 175, 240, 260);

              sCtx.fillStyle = '#38bdf8';
              sCtx.font = 'bold 15px "JetBrains Mono", monospace';
              sCtx.fillText('PIPELINE TELEMETRY', 764, 205);

              const rightStats = [
                ['INPUT CHANNEL', 'AWAITING FEED'],
                ['CONTAINER ENGINE', 'DOCKER ACTIVE'],
                ['DISTRIBUTED BUS', 'REDIS READY'],
                ['FRAME BUFFER', '60 FPS STABLE'],
                ['AUDIO CHANNEL', 'PCM READY']
              ];
              rightStats.forEach(([k, v], idx) => {
                sCtx.fillStyle = '#64748b';
                sCtx.font = '12px "JetBrains Mono", monospace';
                sCtx.fillText(k, 764, 240 + idx * 38);
                sCtx.fillStyle = v.includes('AWAITING') ? '#ffba5e' : '#10b981';
                sCtx.font = 'bold 13px "JetBrains Mono", monospace';
                sCtx.fillText(v, 764, 257 + idx * 38);
              });

              // Bottom status bar
              sCtx.fillStyle = 'rgba(15, 23, 42, 0.88)';
              sCtx.fillRect(24, 545, 976, 52);
              sCtx.strokeStyle = 'rgba(0, 240, 255, 0.35)';
              sCtx.strokeRect(24, 545, 976, 52);

              sCtx.fillStyle = '#94a3b8';
              sCtx.font = '13px "JetBrains Mono", monospace';
              sCtx.fillText('COMMAND_BUS // [ARCHITECT_CORE] · UPLINK ESTABLISHED · HIGH-AVAILABILITY CLUSTER', 44, 576);
              sCtx.fillStyle = '#10b981';
              sCtx.textAlign = 'right';
              sCtx.fillText('READY FOR CONTENT', 980, 576);
            };

            drawMasterScreen(0);
            window._masterDisplayUpdate = (angle) => {
              drawMasterScreen(angle);
            };
          } else if (proj.bgStyle === 'arcade') {
            // Retro 2D CRT TV Theme
            sCtx.fillStyle = '#0f172a';
            sCtx.fillRect(0, 0, 512, 320);
            sCtx.fillStyle = '#fef08a';
            sCtx.beginPath();
            sCtx.arc(100, 80, 40, 0, Math.PI * 2);
            sCtx.fill();
            sCtx.fillStyle = '#22c55e';
            sCtx.fillRect(0, 240, 512, 80);
            sCtx.fillStyle = '#ef4444';
            sCtx.fillRect(240, 190, 40, 50);
            sCtx.fillStyle = '#ffffff';
            sCtx.font = 'bold 22px "JetBrains Mono", monospace';
            sCtx.fillText('PORTFOLIO - 2D', 180, 50);
          } else if (proj.bgStyle === 'charts') {
            // Blue Analytics Graph Theme
            sCtx.fillStyle = '#060d1a';
            sCtx.fillRect(0, 0, 512, 320);
            sCtx.fillStyle = '#1e3a8a';
            sCtx.fillRect(20, 20, 472, 40);
            sCtx.fillStyle = '#38bdf8';
            sCtx.font = 'bold 20px "JetBrains Mono", monospace';
            sCtx.fillText('CLUSTER TELEMETRY — LIVE METRICS', 40, 48);

            // Draw Bar Chart
            const bars = [40, 85, 140, 190, 110, 160, 210, 175, 230];
            bars.forEach((bh, bIdx) => {
              sCtx.fillStyle = '#0284c7';
              sCtx.fillRect(40 + bIdx * 48, 280 - bh, 36, bh);
              sCtx.fillStyle = '#38bdf8';
              sCtx.fillRect(40 + bIdx * 48, 280 - bh, 36, 6);
            });
          } else if (proj.bgStyle === 'yoda') {
            sCtx.fillStyle = '#050508';
            sCtx.fillRect(0, 0, 512, 320);
            sCtx.fillStyle = '#10b981';
            sCtx.font = 'bold 64px Syne, sans-serif';
            sCtx.textAlign = 'center';
            sCtx.fillText('YODA', 256, 170);
            sCtx.fillStyle = '#6ee7b7';
            sCtx.font = '16px "JetBrains Mono", monospace';
            sCtx.fillText('High-Concurrency Node Orchestrator', 256, 215);
          } else {
            // High-Tech Web App Interface Preview
            sCtx.fillStyle = '#090d16';
            sCtx.fillRect(0, 0, 512, 320);
            sCtx.fillStyle = '#1e293b';
            sCtx.fillRect(16, 16, 480, 42);
            sCtx.fillStyle = '#38bdf8';
            sCtx.font = 'bold 18px "JetBrains Mono", monospace';
            sCtx.fillText(proj.badgeText, 32, 44);

            sCtx.fillStyle = 'rgba(255,255,255,0.06)';
            sCtx.fillRect(24, 75, 220, 130);
            sCtx.fillRect(268, 75, 220, 130);
            sCtx.fillStyle = 'rgba(255,255,255,0.04)';
            sCtx.fillRect(24, 220, 464, 75);

            sCtx.fillStyle = '#94a3b8';
            sCtx.font = '15px Inter, sans-serif';
            sCtx.fillText('Enterprise Microservices Pipeline', 36, 120);
            sCtx.fillStyle = '#00f0ff';
            sCtx.fillText('● 99.99% Uptime Verified', 36, 150);
          }

          const sTex = new THREE.CanvasTexture(sCanvas);
          if (proj.isMaster) {
            window._masterDisplayTexture = sTex;
          }
          const screenGeo = new THREE.PlaneGeometry(proj.w, proj.h);
          const sMat = new THREE.MeshBasicMaterial({ map: sTex, side: THREE.DoubleSide });
          const screen = new THREE.Mesh(screenGeo, sMat);
          screen.position.z = proj.isMaster ? 0.16 : 0.12;
          screen.name = 'TV_' + proj.id;
          screen.userData = proj;
          tvGroup.add(screen);

          // Position Group on Right Wall
          tvGroup.position.set(proj.x, proj.y, proj.z);
          tvGroup.rotation.y = -Math.PI / 2;
          scene.add(tvGroup);
        });

        // --- 8. CAMERA TWEENING & HUD MODAL LOGIC ---
        const hudModal = document.getElementById('hud-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalDesc = document.getElementById('modal-desc');
        const modalBadge = document.getElementById('modal-badge');
        const modalTags = document.getElementById('modal-tags');
        const modalLinkDemo = document.getElementById('modal-link-demo');
        const modalLinkGit = document.getElementById('modal-link-git');
        const modalCloseBtn = document.getElementById('modal-close-btn');

        let preInspectCameraPos = DEFAULT_CAM_POS.clone();
        let preInspectCameraTarget = DEFAULT_TARGET.clone();
        let isInspectingTarget = false;

        function openModalWithData(data) {
          if (!hudModal) return;
          modalTitle.textContent = data.title;
          modalBadge.textContent = data.tag || 'PROJECT FOCUS';
          modalDesc.textContent = data.desc;

          modalTags.innerHTML = '';
          if (data.tags && Array.isArray(data.tags)) {
            data.tags.forEach(t => {
              const span = document.createElement('span');
              span.className = 'modal-tag';
              span.textContent = t;
              modalTags.appendChild(span);
            });
          }

          modalLinkDemo.href = data.demo || 'https://github.com/stl-sahadat';
          modalLinkGit.href = data.git || 'https://github.com/stl-sahadat';
          hudModal.classList.add('active');
        }

        function closeModal() {
          if (hudModal) hudModal.classList.remove('active');
          if (isInspectingTarget) {
            isInspectingTarget = false;
            // Smoothly animate camera back to the exact room view before clicking the TV/PC
            const returnPos = (preInspectCameraPos && preInspectCameraPos.distanceTo(DEFAULT_CAM_POS) < 35)
              ? preInspectCameraPos
              : DEFAULT_CAM_POS;
            const returnTarget = preInspectCameraTarget ? preInspectCameraTarget : DEFAULT_TARGET;

            moveCamera(returnPos, returnTarget, 1.3);
          }
        }

        if (modalCloseBtn) {
          modalCloseBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeModal();
          });
        }

        window.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') {
            closeModal();
          }
        });

        function moveCamera(targetPos, lookAtTarget, duration = 1.3) {
          gsap.killTweensOf(camera.position);
          gsap.killTweensOf(controls.target);

          controls.enabled = false;

          gsap.to(camera.position, {
            x: targetPos.x,
            y: targetPos.y,
            z: targetPos.z,
            duration: duration,
            ease: "power2.inOut"
          });
          gsap.to(controls.target, {
            x: lookAtTarget.x,
            y: lookAtTarget.y,
            z: lookAtTarget.z,
            duration: duration,
            ease: "power2.inOut",
            onUpdate: () => controls.update(),
            onComplete: () => {
              controls.enabled = true;
              controls.update();
            }
          });
        }
        window._three = { camera, controls, scene, moveCamera };

        // --- 9. CAMERA CYCLING CONTROLS (BOTTOM-LEFT BUTTON) ---
        const cameraViews = [
          { name: 'overview', pos: DEFAULT_CAM_POS, target: DEFAULT_TARGET },
          { name: 'tvs', pos: new THREE.Vector3(-3.2, 7.5, 0), target: new THREE.Vector3(TV_WALL_X, 7.5, 0) },
          { name: 'pc', pos: new THREE.Vector3(-5.5, 5.35, -3.4), target: new THREE.Vector3(-5.5, 5.35, -8.05) },
          { name: 'notes', pos: new THREE.Vector3(2.4, 4.4, -8.5), target: new THREE.Vector3(2.4, 4.2, -HALF_SIZE + 1.2) }
        ];
        let currentViewIdx = 0;

        const btnCameraCycle = document.getElementById('btn-camera-cycle');
        if (btnCameraCycle) {
          btnCameraCycle.addEventListener('click', () => {
            currentViewIdx = (currentViewIdx + 1) % cameraViews.length;
            const view = cameraViews[currentViewIdx];
            isInspectingTarget = false;
            preInspectCameraPos.copy(view.pos);
            preInspectCameraTarget.copy(view.target);
            if (hudModal) hudModal.classList.remove('active');
            moveCamera(view.pos, view.target);
          });
        }

        // --- 10. RAYCASTING INTERACTION ---
        const raycaster = new THREE.Raycaster();
        const mouse2D = new THREE.Vector2();

        function onCanvasClick(e) {
          const rect = canvas.getBoundingClientRect();
          mouse2D.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          mouse2D.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

          raycaster.setFromCamera(mouse2D, camera);
          const intersects = raycaster.intersectObjects(scene.children, true);

          // Find interactive target along the ray
          const hitItem = intersects.find(i => 
            (i.object.name && i.object.name.startsWith('TV_')) ||
            i.object.name === 'INTERACTIVE_PC' ||
            i.object.name === 'INTERACTIVE_NOTES'
          );

          if (hitItem) {
            let hit = hitItem.object;

            // Clicked any TV Screen (Master or Ambient Satellite)
            if (hit.name && hit.name.startsWith('TV_')) {
              const proj = hit.userData;
              if (proj) {
                if (!isInspectingTarget) {
                  preInspectCameraPos.copy(camera.position);
                  preInspectCameraTarget.copy(controls.target);
                }
                isInspectingTarget = true;
                openModalWithData(proj);
                // Zoom camera straight in front of this TV screen (Master is larger, so distance is adjusted)
                const zoomDist = proj.isMaster ? 10.5 : 7.5;
                moveCamera(
                  new THREE.Vector3(proj.x - zoomDist, proj.y, proj.z),
                  new THREE.Vector3(proj.x, proj.y, proj.z),
                  1.2
                );
              }
            }
            // Clicked PC Curved Screen
            else if (hit.name === 'INTERACTIVE_PC') {
              if (!isInspectingTarget) {
                preInspectCameraPos.copy(camera.position);
                preInspectCameraTarget.copy(controls.target);
              }
              isInspectingTarget = true;
              openModalWithData({
                title: 'Md Sahadat Hossain · Executive Workstation',
                tag: 'ARCHITECT IDENTITY & PC',
                desc: 'Lead Software Architect & Full Stack Developer dedicated to high-concurrency microservices, sub-millisecond response latency, and bulletproof web applications.',
                tags: ['Full Stack', 'System Architecture', 'PostgreSQL', 'Redis', 'Docker', 'Kubernetes'],
                demo: 'assets/pdf/Md-Sahadat-Hossain-Resume.pdf',
                git: 'https://github.com/stl-sahadat'
              });
              moveCamera(new THREE.Vector3(-5.5, 5.35, -3.4), new THREE.Vector3(-5.5, 5.35, -8.05), 1.2);
            }
            // Clicked Whiteboard Notes
            else if (hit.name === 'INTERACTIVE_NOTES') {
              if (!isInspectingTarget) {
                preInspectCameraPos.copy(camera.position);
                preInspectCameraTarget.copy(controls.target);
              }
              isInspectingTarget = true;
              openModalWithData({
                title: 'Direct Communication Channels & Notes',
                tag: 'INSTANT CONNECT',
                desc: 'Feel free to connect directly for enterprise software architecture consultation, project discussions, or agency collaboration.',
                tags: ['sahadat.info01@gmail.com', '+880 1944-576159', 'LinkedIn Verified', 'WhatsApp Active'],
                demo: 'https://wa.me/8801944576159',
                git: 'https://www.linkedin.com/in/mdsahadatconnact/'
              });
              moveCamera(new THREE.Vector3(2.4, 4.4, -8.5), new THREE.Vector3(2.4, 4.2, -HALF_SIZE + 1.2), 1.2);
            }
            // Clicked empty space on canvas while modal is active
            else if (isInspectingTarget) {
              closeModal();
            }
          } else if (isInspectingTarget) {
            closeModal();
          }
        }

        canvas.addEventListener('click', onCanvasClick);

        // Hover cursor pointer detection
        canvas.addEventListener('mousemove', (e) => {
          const rect = canvas.getBoundingClientRect();
          mouse2D.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          mouse2D.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

          raycaster.setFromCamera(mouse2D, camera);
          const intersects = raycaster.intersectObjects(scene.children, true);

          if (intersects.length > 0) {
            let hit = intersects[0].object;
            if (
              (hit.name && hit.name.startsWith('TV_')) ||
              hit.name === 'INTERACTIVE_PC' ||
              hit.name === 'INTERACTIVE_NOTES'
            ) {
              canvas.style.cursor = 'pointer';
              return;
            }
          }
          canvas.style.cursor = 'grab';
        });

        // Fullscreen Toggle
        const fsBtn = document.getElementById('btn-fullscreen');
        if (fsBtn) {
          fsBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
              document.documentElement.requestFullscreen().catch(() => {});
            } else {
              document.exitFullscreen().catch(() => {});
            }
          });
        }

        // --- 11. ANIMATION RENDER LOOP ---
        let clock = new THREE.Clock();

        function animate() {
          requestAnimationFrame(animate);
          const delta = clock.getDelta();
          const elapsed = clock.getElapsedTime();

          // Spin PC RGB Fan rings
          fanRings.forEach((r, idx) => {
            r.rotation.z += delta * (idx % 2 === 0 ? 4 : -4);
          });

          // Update dynamic CRT Terminal typing animation on PC Screen
          if (window._crtTerminalEngine) {
            window._crtTerminalEngine.update(delta, elapsed);
          }

          // Update dynamic radar & telemetry sweep on Primary Master Wall Display
          if (window._masterDisplayUpdate && window._masterDisplayTexture) {
            window._masterDisplayUpdate(elapsed * 1.5);
            window._masterDisplayTexture.needsUpdate = true;
          }

          // Gentle ambient float for AC LED
          if (acLed) {
            acLed.material.color.setHSL(0.5 + Math.sin(elapsed * 2) * 0.05, 1, 0.5);
          }

          controls.update();
          renderer.render(scene, camera);
        }
        animate();

        // Responsive Resizing
        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        });
      })();
    </script>
  </body>
</html>
