<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Md Sahadat Hossain | Redirecting...</title>
    <script>
      (function() {
        var path = window.location.pathname;
        var repo = "/sahadat";
        var hasRepo = path.startsWith(repo);
        var subpath = hasRepo ? path.substring(repo.length) : path;
        subpath = subpath.replace(/^\/+|\/+$/g, "");

        // If subpath is 3d, redirect directly to 3d/
        if (subpath === "3d" || subpath.startsWith("3d/")) {
          window.location.replace((hasRepo ? repo : "") + "/3d/");
          return;
        }

        // Map aliases to section IDs
        var aliasMap = {
          "about": "about",
          "profile": "about",
          "projects": "projects",
          "work": "work",
          "experience": "work",
          "skills": "services",
          "services": "services",
          "tech-stack": "services",
          "showcase": "gallery",
          "gallery": "gallery",
          "contact": "contact"
        };

        var targetSection = aliasMap[subpath] || subpath;
        var destination = (hasRepo ? repo : "") + "/" + (targetSection ? "#" + targetSection : "");
        window.location.replace(destination);
      })();
    </script>
    <style>
      body {
        background-color: #0d1117;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        text-align: center;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <p>Loading Md Sahadat Hossain's Portfolio...</p>
  </body>
</html>
